[project]
name = "tproof"
version = "0.1.0"
description = "Local Lean theorem proving pipeline"
requires-python = ">=3.10"
dependencies = [
  "typer>=0.24.1",
  "rich>=14.3.3",
  "pypdf>=4.0.0",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
